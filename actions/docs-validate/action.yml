name: Validate Roc docs
description: Validate generated versioned docs and preserved historical docs.
inputs:
  docs_root:
    description: Directory containing generated docs.
    default: www
  docs_version:
    description: Docs version. Empty uses DOCS_VERSION or RELEASE_VERSION env.
    default: ""
  snapshot_file:
    description: File written by docs-snapshot.
    default: .release/docs-before.json
runs:
  using: composite
  steps:
    - id: validate
      shell: bash
      env:
        DOCS_ROOT: ${{ inputs.docs_root }}
        DOCS_VERSION_INPUT: ${{ inputs.docs_version }}
        SNAPSHOT_FILE: ${{ inputs.snapshot_file }}
      run: |
        set -euo pipefail

        docs_version="$DOCS_VERSION_INPUT"
        if [[ -z "$docs_version" ]]; then
          docs_version="${DOCS_VERSION:-${RELEASE_VERSION:-}}"
        fi
        if [[ -z "$docs_version" ]]; then
          echo "docs_version input, DOCS_VERSION env, or RELEASE_VERSION env is required." >&2
          exit 2
        fi

        python3 "$GITHUB_ACTION_PATH/../../scripts/release/release.py" validate-docs \
          --docs-root "$DOCS_ROOT" \
          --docs-version "$docs_version" \
          --snapshot-file "$SNAPSHOT_FILE"
