name: Run Roc bump check
description: Verify the requested release version with roc bump.
inputs:
  release_version:
    description: Strict semver release version. Empty uses RELEASE_VERSION env.
    default: ""
  bump_check:
    description: How to handle roc bump verification. One of warn, require, or off.
    default: require
  bump_entrypoint:
    description: Package entrypoint passed to roc bump.
    default: main.roc
  previous_url:
    description: Previous bundle URL. Empty falls back to previous_url_file when present.
    default: ""
  previous_url_file:
    description: File written by resolve-previous-release.
    default: .release/previous-url.txt
  output_file:
    description: File where roc bump output is written.
    default: .release/bump-output.txt
outputs:
  output_file:
    description: File containing roc bump output.
    value: ${{ steps.bump.outputs.output_file }}
runs:
  using: composite
  steps:
    - id: bump
      shell: bash
      env:
        RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        BUMP_CHECK: ${{ inputs.bump_check }}
        BUMP_ENTRYPOINT: ${{ inputs.bump_entrypoint }}
        PREVIOUS_URL_INPUT: ${{ inputs.previous_url }}
        PREVIOUS_URL_FILE: ${{ inputs.previous_url_file }}
        OUTPUT_FILE: ${{ inputs.output_file }}
      run: |
        set -euo pipefail

        release_version="$RELEASE_VERSION_INPUT"
        if [[ -z "$release_version" ]]; then
          release_version="${RELEASE_VERSION:-}"
        fi
        if [[ -z "$release_version" ]]; then
          echo "release_version input or RELEASE_VERSION env is required." >&2
          exit 2
        fi

        previous_url="$PREVIOUS_URL_INPUT"
        if [[ -z "$previous_url" && -f "$PREVIOUS_URL_FILE" ]]; then
          previous_url="$(cat "$PREVIOUS_URL_FILE")"
        fi

        python3 "$GITHUB_ACTION_PATH/../../scripts/release/release.py" run-bump-check \
          --mode "$BUMP_CHECK" \
          --version "$release_version" \
          --entrypoint "$BUMP_ENTRYPOINT" \
          --previous-url "$previous_url" \
          --output-file "$OUTPUT_FILE"

        python3 "$GITHUB_ACTION_PATH/../../scripts/release/release.py" append-github-output \
          --github-output "$GITHUB_OUTPUT" \
          --name output_file \
          --value "$OUTPUT_FILE"
